# Золотой набор Sprint 4. Только бюджет, эталоны = ingest Excel
# (БДР для индексации.xlsx / Смета затрат). Договоров в индексе нет:
# тип «номер договора» заменён на точный код статьи; обязательства/остаток
# в живой смете null — проверяем отказ от выдуманных сумм.
source_file: БДР для индексации.xlsx
sheet: Смета затрат
amount_unit: thousand_rub
tolerance: 0.01

cases:
  - id: code-1.8.2
    type: code
    question: Какой лимит по статье production:1.8.2?
    expect:
      article_codes: [production:1.8.2]
      numbers: [124970.29767396959]
      contains: [электроэнергия]
      null_fields: [fact, obligation, remain_free]
      allow_numbers: [2026, 23]

  - id: code-1.8.3
    type: code
    question: Какой лимит по статье production:1.8.3?
    expect:
      article_codes: [production:1.8.3]
      numbers: [6808.204632813404]
      contains: [водоснабжение]
      allow_numbers: [2026, 24]

  - id: code-1.8.1
    type: code
    question: Какой лимит по статье production:1.8.1?
    expect:
      article_codes: [production:1.8.1]
      numbers: [4442.201255540607]
      contains: [теплоэнергия]
      allow_numbers: [2026, 22]

  - id: branch-1.8
    type: branch
    question: Сводка по ветке production:1.8, производственные расходы.
    expect:
      article_codes: [production:1.8.2, production:1.8.1, production:1.8.3]
      numbers: [136220.7035623236]
      allow_numbers: [2026, 124970.29767396959, 6808.204632813404, 4442.201255540607, 3]

  - id: remain-1.8.2
    type: remain
    question: Какой свободный остаток по статье production:1.8.2?
    expect:
      article_codes: [production:1.8.2]
      null_fields: [remain_free]
      allow_numbers: [2026, 23, 124970.29767396959]

  - id: fact-vs-1.8.2
    type: fact_vs_accepted
    question: Какие факт и принятые обязательства по статье production:1.8.2?
    expect:
      article_codes: [production:1.8.2]
      contains: [факт]
      contains_any: [принят, обязательств]
      null_fields: [fact, obligation]
      allow_numbers: [2026, 23, 124970.29767396959]

  - id: refuse-9.9.9
    type: refuse
    question: Какой лимит по статье production:9.9.9?
    expect:
      refusal: true

  - id: refuse-99.99
    type: refuse
    question: Что в смете по статье production:99.99?
    expect:
      refusal: true

  - id: refuse-quantum
    type: refuse
    question: Сколько предусмотрено на квантовый транспорт?
    expect:
      refusal: true

  - id: refuse-contract
    type: refuse
    question: Что за договор 12/2025?
    expect:
      refusal: true
      contains_any: [смета, индекс, нет, договор]

  - id: cross-energy-prod
    type: cross
    question: Какой лимит на электроэнергию в производственных расходах?
    expect:
      article_codes: [production:1.8.2]
      numbers: [124970.29767396959]
      allow_numbers: [2026, 23, 7494.078296098716]

  - id: kind-energy-mgmt
    type: kind
    question: Какой лимит на электроэнергию в управленческих расходах?
    expect:
      article_codes: [management:1.1.2]
      numbers: [7494.078296098716]
      allow_numbers: [2026, 146, 124970.29767396959]

  - id: cross-water-prod
    type: cross
    question: Сколько лимит на водоснабжение в производственных расходах?
    expect:
      article_codes: [production:1.8.3]
      numbers: [6808.204632813404]
      allow_numbers: [2026, 24, 663.9828704790051]

  - id: cross-rent-pipes
    type: cross
    question: Сколько предусмотрено на аренду газопроводов в производственных расходах?
    expect:
      article_codes: [production:5.1.1]
      numbers: [1033066.45202]
      allow_numbers:
        [2026, 681351.76452, 335820.0, 15894.6875, 0]

  - id: code-5.1.1.1
    type: code
    question: Какой лимит по статье production:5.1.1.1?
    expect:
      article_codes: [production:5.1.1.1]
      numbers: [681351.76452]
      allow_numbers: [2026, 66]

  - id: code-5.1.2
    type: code
    question: Какой лимит по аренде зданий и помещений, статья production:5.1.2?
    expect:
      article_codes: [production:5.1.2]
      numbers: [137068.8569812994]
      contains: [аренд]
      allow_numbers: [2026, 70]

  - id: remain-guard
    type: remain
    question: Какой свободный остаток по услугам охраны, статья production:5.5.5?
    expect:
      article_codes: [production:5.5.5]
      null_fields: [remain_free]
      allow_numbers: [2026, 110, 122255.96922072745]

  - id: fact-vs-payroll
    type: fact_vs_accepted
    question: Разведи факт и принятые по статье production:2 (оплата труда).
    expect:
      article_codes: [production:2]
      contains: [факт]
      contains_any: [принят, обязательств]
      null_fields: [fact, obligation]
      allow_numbers: [2026, 44, 3189637.01997848]

  - id: branch-5.1
    type: branch
    question: Сводка по ветке production:5.1 (арендная плата), производственные.
    expect:
      numbers: [1177312.9440568138]
      allow_numbers:
        [
          2026,
          1033066.45202,
          681351.76452,
          335820.0,
          15894.6875,
          137068.8569812994,
          6298.393282532798,
          475.0808129815517,
          404.16095999999993,
          0,
        ]

  - id: code-1.5
    type: code
    question: Какой лимит по статье production:1.5?
    expect:
      article_codes: [production:1.5]
      numbers: [142479.81]
      contains: [газ]
      allow_numbers: [2026, 18]

  - id: code-5.6.1
    type: code
    question: Какой лимит по налогу на имущество, статья production:5.6.1?
    expect:
      article_codes: [production:5.6.1]
      numbers: [509129.0]
      allow_numbers: [2026, 127]

  - id: code-zero-rent-auto
    type: code
    question: Какой лимит по статье production:5.1.3 (аренда автотранспорта)?
    expect:
      article_codes: [production:5.1.3]
      numbers: [0]
      contains: [автотранспорт]
      allow_numbers: [2026, 71, 0]

  - id: kind-mgmt-fot
    type: kind
    question: Какой лимит фонда оплаты труда в управленческих расходах, статья management:2.1?
    expect:
      article_codes: [management:2.1]
      numbers: [505306.4150212401]
      allow_numbers: [2026, 167]

  - id: remain-1.5
    type: remain
    question: Какой свободный остаток по статье production:1.5?
    expect:
      article_codes: [production:1.5]
      null_fields: [remain_free]
      allow_numbers: [2026, 18, 142479.81]

  - id: refuse-contract-roma
    type: refuse
    question: Какие обязательства по договору с ООО Ромашка?
    expect:
      refusal: true
      contains_any: [смета, индекс, нет, договор, обязательств]
