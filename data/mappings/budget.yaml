# Маппинг бюджета → коллекция budget_items.
# Шаблон файла, не автодетект. Утверждает владелец репозитория (Сергей).
# Контракты и обязательства — отдельные YAML, когда появятся выгрузки.

version: 1
kind: budget
collection: budget_items

source:
  file: "БДР для индексации.xlsx"
  sheet: "Смета затрат"
  header_rows: [7, 8, 9, 10, 11]
  data_start_row: 12
  data_end_row: 251
  year: 2026
  currency: RUB
  amount_unit: thousand_rub

# Листы той же книги, которые ingest не читает (риск двойного плана / не статьи).
skip_sheets:
  - "ФинРез"
  - "Оценочные показатели"

# ---------------------------------------------------------------------------
# Колонки
# ---------------------------------------------------------------------------

columns:
  # Сегменты иерархического кода. Пустые хвосты отбрасываются.
  # Код листа: "1.8.2" из заполненных A–G.
  code_segments: [A, B, C, D, E, F, G]

  # Имя статьи: первая непустая из списка (merge сдвигает H→I→J→K).
  name_candidates: [H, I, J, K, L, M, N]

  amounts:
    limit_amount:
      column: AA
      header: "2026 год (план) / Всего"
      required: true

  # Не канон контроля. В payload.extra и в text, отдельные точки не плодить.
  extra:
    fact_2024_total: S
    plan_2025_total: W
    q1_2026_total: AE
    q2_2026_total: AI
    h1_2026_total: AM
    q3_2026_total: AQ
    m9_2026_total: AU
    q4_2026_total: AY
    # Разрез по видам деятельности (транспортировка / СУГ / прочие) — рядом
    # с каждым «Всего»; в индекс как extra, не отдельные точки.

# Колонок fact_amount / obligation_amount / remain_free в этом файле нет.
# remain_free не считать. remain_free_source не писать, пока не будет реестра контроля.

# ---------------------------------------------------------------------------
# Два блока: хранить раздельно, контролировать по имени
# ---------------------------------------------------------------------------

blocks:
  - expense_kind: production
    header_name: "ПРОИЗВОДСТВЕННЫЕ РАСХОДЫ"
    total_name: "ИТОГО производственные расходы"
  - expense_kind: management
    header_name: "УПРАВЛЕНЧЕСКИЕ РАСХОДЫ"
    total_name: "ИТОГО управленческие расходы"

# Текущий блок задаёт строка-заголовок. Коды A–G в каждом блоке начинаются заново.
# Строка относится к блоку, пока не встретится следующий заголовок / конец данных.

# ---------------------------------------------------------------------------
# Идентичность и канонические поля точки
# ---------------------------------------------------------------------------

identity:
  # Стабильный ключ. Не source+row: при вставке строк в середину листа id поедет.
  point_id: "hash(source.file, source.sheet, expense_kind, sheet_code)"
  article_code: "{expense_kind}:{sheet_code}"   # production:1.8.2
  ancestor_codes: "каждый предок тоже с префиксом expense_kind"

fields:
  required:
    - expense_kind          # production | management
    - article_code
    - article_name
    - article_name_norm
    - match_key
    - article_level         # 1…5, на этом файле 1…4
    - year
    - limit_amount          # число, ноль допустим
    - amount_unit
    - currency
  optional_empty_on_this_file:
    - fact_amount
    - obligation_amount
    - remain_free
    - remain_unexecuted
    - unit                  # ЦФО в смете нет
  path:
    - l1_code
    - l1_name
    - l2_code
    - l2_name
    - l3_code
    - l3_name
    - l4_code
    - l4_name
    - l5_code               # на этом файле пусто
    - l5_name
    - ancestor_codes

# ---------------------------------------------------------------------------
# Иерархия: кто лист (точка), кто только путь
# ---------------------------------------------------------------------------

hierarchy:
  max_level: 5
  # Родитель, сумма которого равна сумме детей (epsilon 0.05 тыс. руб.) — не точка.
  skip_parent_if_equals_children: true
  parent_sum_epsilon: 0.05
  # Нет детей вообще — лист, даже уровень 1.
  leaf_if_no_children: true
  # Деньги на родителе, все потомки 0 или пустые — индексируем родителя,
  # заглушки не пишем. Иначе теряем ФОТ / соцвзносы.
  collapse_zero_stub_children: true
  # Настоящий лист с нулевым лимитом — в индекс (статья должна существовать).
  index_zero_leaves: true

# Живые примеры (2026, тыс. руб.)
# parent, не точка:
#   production:1     Материальные расходы
#   production:1.8   Коммунальные услуги
# leaf:
#   production:1.8.2 электроэнергия     124970.30
#   management:1.1.2 электроэнергия       7494.08
# collapse_zero_stub_children:
#   production:2     Расходы на оплату труда  3189637  (дети 2.1/2.2 = 0)
#   production:3     Отчисления в фонды…       956891  (все дети 0)
#   management:3     Отчисления в фонды…       151592  (все дети 0)
# деньги на ребёнке, родителя не писать:
#   management:2.1   Фонд оплаты труда         505306

# ---------------------------------------------------------------------------
# match_key — склейка одноимённых статей для контроля
# ---------------------------------------------------------------------------

match_key:
  # Вопрос без блока («лимит по охране») — сумма листьев с одним match_key.
  # Фильтр expense_kind сужает до одного блока.
  # Пока нет реестра, будущий budget_article обязательств = match_key.
  default: article_name_norm
  normalize:
    - lower
    - yo_to_e
    - collapse_whitespace
    - strip_trailing_punct
  # Иначе «Прочие» материальных склеится с «Прочие» прочих расходов.
  qualify_with_parent_if_name_in:
    - прочие
    - прочее
  name_aliases:
    - from: "оформление в собственность земли, других ОС"
      to: "оформление в собственность земли и других ОС"

# ---------------------------------------------------------------------------
# Пропуск строк (не reject)
# ---------------------------------------------------------------------------

skip_rows:
  - reason: header_rows
    rows: [7, 8, 9, 10, 11]
  - reason: block_header
    names:
      - "ПРОИЗВОДСТВЕННЫЕ РАСХОДЫ"
      - "УПРАВЛЕНЧЕСКИЕ РАСХОДЫ"
  - reason: block_total
    names:
      - "ИТОГО производственные расходы"
      - "ИТОГО управленческие расходы"
    # на листе у итога код сегмента A = 6
  - reason: leftover_header
    # Копия нумерации колонок после смены блока (A=1, имя="2").
    row: 142
  - reason: empty_number_stub
    # Хвост нумерации без имени в управленческом блоке.
    rows: [233, 234, 235, 236, 237]
  - reason: no_name
  - reason: parent_not_leaf

# ---------------------------------------------------------------------------
# Rejects: строка-кандидат в лист, но данные битые
# ---------------------------------------------------------------------------

rejects:
  # Кандидат = есть имя, есть код, не skip, проходит правило листа.
  - when: leaf_candidate
    missing: [article_name, sheet_code, expense_kind]
    action: reject
  - when: leaf_candidate
    limit_amount: not_a_number
    action: reject
  - when: leaf_candidate
    limit_amount: empty
    action: reject          # ноль — ок, пусто — нет
  - when: leaf_candidate
    expense_kind: unknown   # строка до первого заголовка блока
    action: reject

# ---------------------------------------------------------------------------
# Объединённые ячейки / шапка / итоги
# ---------------------------------------------------------------------------

excel_quirks:
  merged_cells: take_top_left_value
  name_from_first_nonempty: true
  header_is_multiline: true
  do_not_treat_column_index_row_as_data: true   # стр. 11 и 142
  totals_are_not_articles: true

# ---------------------------------------------------------------------------
# Текст для эмбеддинга (детерминированная склейка, Sprint 2)
# ---------------------------------------------------------------------------

text_template: |
  Тип: статья бюджета
  Вид расходов: {expense_kind}
  Код: {article_code}
  Ветка: {path_text}
  Родители: {ancestor_text}
  Статья: {article_name}
  Путь: {l1_name} / {l2_name} / {l3_name} / {l4_name} / {l5_name}
  Год: {year}
  Лимит: {limit_amount} {amount_unit}

# ---------------------------------------------------------------------------
# Открытые развилки — не разветвлять код заранее
# ---------------------------------------------------------------------------

open_questions:
  - "ЦФО/unit в этой смете нет; если появится — отдельная колонка, не выдумывать."
  - "Кварталы и виды деятельности остаются extra, пока не будет отдельного требования."
  - "remain_free появится только вместе с реестром контроля, не вычислять из сметы."
